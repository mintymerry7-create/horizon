[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Scheduling hints for the game's threads and its allocator, and the other OS calls the crates that forbid unsafe code can't make"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

# Opening Safari on iOS (ios_open.rs); the same crates the narrator uses on macOS.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSURL"] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
