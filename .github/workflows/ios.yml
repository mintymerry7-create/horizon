name: ios
# The unsigned iOS app (ios/build-ipa.sh): an artifact of every run, and the `ios-latest` prerelease when run by
# hand with `release` on. docs/ios.md.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the IPA as the ios-latest prerelease
        type: boolean
        default: true
      simulator:
        description: Also run the game in the iOS Simulator (screenshots and logs)
        type: boolean
        default: false
  push:
    branches: ["**"]
    paths:
      - 'ios/**'
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build Horizon.ipa
        env:
          HORIZON_IOS_BUILD: ${{ github.run_number }}
        run: bash ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ipa
          path: target/ios/Horizon.ipa
          if-no-files-found: error
      - name: The owner's IPA, with their game files (private draft release)
        # The repository is public, so this never goes to an artifact: only to the draft release, which only
        # people with write access see. Never the ios-latest release.
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.HORIZON_SIM_DATA_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No HORIZON_SIM_DATA_KEY: no IPA with game files"; exit 0; fi
          # The small IPA too: once the one with files has run, the files stay in Documents.
          gh release upload sim-data target/ios/Horizon.ipa --clobber -R "$GITHUB_REPOSITORY"
          # And at a public link an installer app can download from: it holds none of the game files.
          gh release upload ios-latest target/ios/Horizon.ipa --clobber -R "$GITHUB_REPOSITORY"
          gh release download sim-data -R "$GITHUB_REPOSITORY" -p sim-data.bin -D "$RUNNER_TEMP"
          printf %s "$KEY" > "$RUNNER_TEMP/key"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/sim-data.bin" -pass file:"$RUNNER_TEMP/key"             | tar -xz -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/key" "$RUNNER_TEMP/sim-data.bin"
          app=target/ios/aarch64-apple-ios/Payload/Horizon.app
          # One zip, not 28,000 files: signers and the installer check each file of the bundle. Compressed
          # here, since the IPA's zip stores .zip files as they are.
          (cd "$RUNNER_TEMP/26.3" && zip -qr "$OLDPWD/$app/resources.zip" .)
          rm -rf "$RUNNER_TEMP/26.3"
          (cd target/ios/aarch64-apple-ios && zip -qry "$RUNNER_TEMP/Horizon-with-files.ipa" Payload)
          rm "$app/resources.zip"
          gh release upload sim-data "$RUNNER_TEMP/Horizon-with-files.ipa" --clobber -R "$GITHUB_REPOSITORY"
          ls -lh "$RUNNER_TEMP/Horizon-with-files.ipa"
  simulator:
    # The same game in the iOS Simulator: screenshots and logs of the missing-files screen, and with the
    # encrypted resources of the sim-data draft release, the title screen and a new world (ios/sim-test.sh).
    # Only when asked: GitHub pauses a fork's workflows that use too many macOS minutes.
    if: github.event_name == 'workflow_dispatch' && inputs.simulator
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim
      - name: Build for the Simulator
        run: bash ios/build-app.sh aarch64-apple-ios-sim fast
      - name: Resources (encrypted draft release)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.HORIZON_SIM_DATA_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No HORIZON_SIM_DATA_KEY: the run tests the missing-files screen only"; exit 0; fi
          gh release download sim-data -R "$GITHUB_REPOSITORY" -p sim-data.bin -D "$RUNNER_TEMP"
          printf %s "$KEY" > "$RUNNER_TEMP/key"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$RUNNER_TEMP/sim-data.bin" -pass file:"$RUNNER_TEMP/key"             | tar -xz -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/key" "$RUNNER_TEMP/sim-data.bin"
          echo "RES=$RUNNER_TEMP/26.3" >> "$GITHUB_ENV"
      - name: Run in the Simulator
        timeout-minutes: 25
        run: bash ios/sim-test.sh target/ios/aarch64-apple-ios-sim/Payload/Horizon.app "$RUNNER_TEMP/sim" "${RES:-}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Screenshots and logs only: never the resources.
          name: simulator
          path: |
            ${{ runner.temp }}/sim/*.png
            ${{ runner.temp }}/sim/*.log
            ${{ runner.temp }}/sim/*.json
            ${{ runner.temp }}/sim/*.ips
            ${{ runner.temp }}/sim/*-crash-reports
  publish:
    needs: ipa
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Horizon-ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Horizon for iOS (unsigned)
          prerelease: true
          make_latest: false
          files: Horizon.ipa
          body: |
            Unsigned IPA of Horizon for iPhone and iPad (iOS 15+), from ${{ github.sha }}.
            Sign and install it with Sideloadly, AltStore or TrollStore, then follow docs/ios.md for the game files.
